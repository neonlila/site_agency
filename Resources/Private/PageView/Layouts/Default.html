<f:asset.css identifier="bootstrap" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
<f:asset.css identifier="main" href="EXT:site_agency/Resources/Public/Css/main.css" />
<main>

    <f:if condition="{site.settings.siteAgency.socialFeed}">
        <f:render partial="Socials" arguments="{_all}" />
    </f:if>

    <f:render partial="Navigation" arguments="{_all}"/>
    <f:render section="Main"/>
    <f:render partial="Footer" arguments="{_all}"/>
</main>
<f:asset.script identifier="bootstrap" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" />
<f:asset.script identifier="main" src="EXT:site_agency/Resources/Public/JavaScript/main-js.js" />
