<f:layout name="Default"/>
<f:section name="Main">

    <section id="subsection_hero" class="container">
        <f:render partial="Content" arguments="{records: content.hero.records}"/>
    </section>

    <f:if condition="{site.settings.siteAgency.breadcrumbs}">
        <f:render partial="Breadcrumbs" arguments="{_all}"/>
    </f:if>
    
    <section id="subsection_content" class="container">
        <div class="row">
            <div class="col-md-8">
                <f:render partial="Content" arguments="{records: content.context.records}"/>
            </div>
            <div class="col-md-4">
                 <f:render partial="Content" arguments="{records: content.sidebar.records}"/>
            </div>
        </div>
    </section>
    <section id="subsection_news">
        <f:render partial="Content" arguments="{records: content.news.records}"/>
    </section>

</f:section>
